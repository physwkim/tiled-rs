name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo for the lib plus every integration-test binary overflows
  # the ubuntu-latest runner disk at link time ("No space left on device").
  # Line tables keep file:line in test backtraces at a fraction of the size;
  # the test profile inherits this from dev.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Format + lint on a single OS (cheap, fast feedback). Warnings are errors.
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Build + test on all three host platforms with the DEFAULT feature set.
  # Default features are pure-Rust end to end: rustls TLS (no OpenSSL), bundled
  # SQLite + pure-Rust Postgres via sqlx, pure-Rust HDF5/NetCDF/Excel/Mongo
  # client. The native-library features are intentionally NOT built here —
  # `saml` needs libxml2 + xmlsec1, `pam` binds the system libpam and is
  # Unix-only — so `--all-features` is deliberately avoided to keep the matrix
  # green on Windows without per-OS system-library provisioning.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The hosted ubuntu image ships ~20 GB of toolchains this build never
      # uses; reclaim them so the target dir has headroom (macOS/Windows
      # runners have larger disks and don't need this).
      - name: free disk space (ubuntu)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # New cache namespace: caches saved before the debuginfo slimming
          # hold full-debug artifacts that the profile change invalidates —
          # restoring them would only burn disk and restore time.
          prefix-key: v1-rust
      - uses: taiki-e/install-action@nextest
      - name: build (default features)
        run: cargo build --workspace --locked
      # `--no-fail-fast`: run every test and report all failures, instead of
      # nextest aborting at the first one (which hides the rest of the surface,
      # especially during cross-platform bring-up).
      - name: test (default features)
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: doctests (default features)
        run: cargo test --doc --workspace --locked
