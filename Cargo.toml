[workspace]
# Single-crate layout: the root package below is the sole workspace member.
# tiled-web-spa is a WASM-target crate built independently by trunk with its
# own release profile (opt-level=z, lto=fat). Excluded so a host `cargo build`
# doesn't pull it onto the wrong target.
exclude = ["crates/tiled-web-spa"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "BSD-3-Clause"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
rmp-serde = "1"

# HTTP server
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-zstd"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# URL / file:// URI handling (cross-platform path <-> URI)
url = "2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "json", "uuid", "chrono", "migrate"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Authentication
jsonwebtoken = "9"

# Arrow / Parquet
arrow = { version = "54", features = ["ipc", "json", "csv", "prettyprint"] }
parquet = { version = "54", features = ["arrow", "async"] }

# N-dimensional arrays
ndarray = "0.16"
bytes = "1"

# Compression
flate2 = "1"
zstd = "0.13"
lz4_flex = "0.11"
blosc2-pure-rs = "0.2.4"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Concurrent data structures
dashmap = "6"

# Security
subtle = "2"
sha2 = "0.10"

# Base64
base64 = "0.22"

# Regex
regex = "1"

# Futures
futures = "0.3"
tokio-stream = "0.1"

# Testing
tempfile = "3"

# Image formats (feature-gated)
tiff = "0.9"
# Only the formats tiled-rs actually serves are enabled (file_resolver.rs
# routes image/png, image/jpeg, image/tiff). Dropping image's default
# format set removes the AVIF encoder chain (ravif -> rav1e ->
# bitstream-io -> core2), whose core2 0.4.0 is yanked with no non-yanked
# `^0.4` replacement.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

# HDF5 (feature-gated) — pure-Rust HDF5 reader/writer, no system libhdf5.
# The adapter reads the dtype class + sign via H5Dataset::datatype() (added in
# rust-hdf5 0.2.18 — see hdf5_adapter.rs dtype_from_hdf5()) and reads dataset
# attribute element types via H5Attribute::datatype() (added in 0.2.20 — see
# read_hdf5_attrs()).
rust-hdf5 = { version = "0.2.20", features = ["deflate"] }

# Zarr
zarrs = { version = "0.20", features = ["filesystem"] }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }

# CSV
csv = "1"

# Excel (pure-Rust xlsx/xls/ods reader — no system deps)
calamine = "0.35"

# NetCDF-3 classic (pure Rust, no system deps)
netcdf3 = "0.6"

# Ordered maps
indexmap = { version = "2", features = ["serde"] }

# JMESPath (select_metadata filtering — M1)
jmespath = "0.3"

# MongoDB
mongodb = { version = "3", features = ["sync"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[package]
name = "tiled-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of Tiled — a structured scientific data access service (server, client, adapters, auth)."
repository = "https://github.com/physwkim/tiled-rs"
readme = "README.md"

[lib]
name = "tiled_rs"
path = "src/lib.rs"

[[bin]]
name = "tiled"
path = "src/main.rs"

[features]
# Everything pure-Rust and cross-platform is ON by default. The only opt-in
# features are `saml` and `pam`, which pull system C libraries (libxml2/xmlsec1
# for SAML, libpam for PAM) — `pam` does not exist on Windows. Keeping them
# opt-in preserves the pure-Rust default and the green Linux/macOS/Windows CI.
default = [
    "json", "arrow-ipc", "msgpack",
    "csv", "csv-adapter",
    "parquet", "parquet-adapter", "parquet-serializer",
    "image", "image-serializer", "tiff", "tiff-adapter",
    "hdf5", "hdf5-adapter", "hdf5-serializer", "netcdf-adapter",
    "zarr", "zarr-adapter", "excel-adapter", "sql-adapter",
    "sqlite", "ldap", "web", "npy",
]

# --- serializers / always-pure-Rust toggles (deps now non-optional) ---
json = []
arrow-ipc = []
msgpack = []
csv = []

# --- read adapters ---
csv-adapter = []
parquet = []
parquet-adapter = ["parquet"]
excel-adapter = ["dep:calamine"]
netcdf-adapter = ["dep:rust-hdf5", "dep:netcdf3"]
zarr = ["dep:zarrs", "dep:object_store"]
zarr-adapter = ["zarr"]
sql-adapter = []

# --- export serializers (server-level aliases over the low-level toggles) ---
parquet-serializer = ["parquet"]
image = ["dep:tiff", "dep:image"]
image-serializer = ["image"]
tiff = ["dep:tiff", "dep:image"]
tiff-adapter = ["tiff"]
hdf5 = ["dep:rust-hdf5", "dep:tempfile"]
hdf5-adapter = ["hdf5"]
hdf5-serializer = ["hdf5"]

# --- catalog backends (markers; sqlx always carries sqlite + postgres) ---
sqlite = []
postgres = []

# --- mongo file handlers ---
npy = ["dep:ndarray"]

# --- web admin UI / SPA ---
web = []

# --- streaming cache backends ---
# Shared Redis backend for the per-node data-streaming cache (Wave-24 PR8).
# Default OFF: pulls the `redis` client and its async connection stack, only
# needed for multi-process deployments. The in-process `memory` backend and the
# disabled no-op backend stay in the default build.
streaming-redis = ["dep:redis"]

# --- authentication ---
# OIDC (external SSO: code/device flows) is always built in: it pulls no extra
# dependencies (reqwest/jwt/serde are non-optional) and the server/CLI assume it
# is present, so a toggle would be fiction. ldap/saml/pam stay opt-in because
# they each gate a real dependency.
ldap = ["dep:ldap3"]
# opt-in: system C libraries / not available on Windows
saml = ["dep:samael"]
pam = ["dep:libc"]

[dependencies]
# Core (always-on, workspace-pinned)
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
arrow = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
dashmap = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
lz4_flex = { workspace = true }
jsonwebtoken = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mongodb = { workspace = true }
indexmap = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
rmp-serde = { workspace = true }
jmespath = { workspace = true }
blosc2-pure-rs = { workspace = true }
csv = { workspace = true }
parquet = { workspace = true }
clap = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
reqwest = { workspace = true, features = ["cookies"] }

# Always-on (crate-literal versions)
argon2 = "0.5"
rand = "0.8"
# IEEE-754 half-precision (float16) decode for element serializers; already in
# the tree transitively via arrow-array, declared here for direct use.
half = "2"
async-trait = "0.1"
percent-encoding = "2"
hmac = "0.12"
json-patch = "3"
zip = "2"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
askama = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
dirs = "5"
http = "1"
rpassword = "7"
webbrowser = "1"
walkdir = "2"
serde_bytes = "0.11"
notify = "7"

# Feature-gated (optional)
rust-hdf5 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tiff = { workspace = true, optional = true }
image = { workspace = true, optional = true }
zarrs = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
netcdf3 = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls", "tls-rustls-ring"], optional = true }
samael = { version = "0.0.21", features = ["xmlsec"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
form_urlencoded = "1"
