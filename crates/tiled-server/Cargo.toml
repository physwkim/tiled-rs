[package]
name = "tiled-server"
version.workspace = true
edition.workspace = true

[features]
default = ["csv-adapter", "image-serializer", "parquet-serializer", "web"]
csv-adapter = ["tiled-adapters/csv-adapter"]
parquet-adapter = ["tiled-adapters/parquet"]
tiff-adapter = ["tiled-adapters/tiff"]
hdf5-adapter = ["tiled-adapters/hdf5"]
image-serializer = ["tiled-serialization/image"]
parquet-serializer = ["tiled-serialization/parquet"]
web = ["dep:tiled-web"]

[dependencies]
tiled-core = { workspace = true }
tiled-adapters = { workspace = true }
tiled-serialization = { workspace = true }
tiled-catalog = { workspace = true }
tiled-auth = { workspace = true }
tiled-access = { workspace = true }
tiled-web = { workspace = true, optional = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
arrow = { workspace = true }
percent-encoding = "2"
subtle = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
rmp-serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.28"
reqwest = { workspace = true }
futures = { workspace = true }
rmp-serde = { workspace = true }
indexmap = { workspace = true }
tiled-core = { workspace = true }
tiled-adapters = { workspace = true }
tiled-serialization = { workspace = true }
tiled-catalog = { workspace = true }
tiled-auth = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
