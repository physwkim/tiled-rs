[package]
name = "tiled-web-spa"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm-opt is invoked from trunk; this profile keeps the wasm size
# competitive without exotic flags.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
