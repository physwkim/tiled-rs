[package]
name = "tiled-cli"
version.workspace = true
edition.workspace = true

[features]
default = ["web"]
# Forwards to tiled-server's `web` feature so the same `#[cfg(feature = "web")]`
# gate works on AppState field initialisations in this crate.
web = ["tiled-server/web", "dep:tiled-web"]
# Compile in the LDAP / PAM username-password authenticators (off by default,
# like SAML). Each forwards to the matching tiled-auth feature; when off, an
# `authentication.providers` entry that names LDAP/PAM is skipped with a warning.
ldap = ["tiled-auth/ldap"]
pam = ["tiled-auth/pam"]

[dependencies]
tiled-web = { workspace = true, optional = true }
tiled-core = { workspace = true }
tiled-server = { workspace = true }
tiled-adapters = { workspace = true }
tiled-serialization = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indexmap = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true }
tiled-mongo = { workspace = true }
tiled-catalog = { workspace = true }
tiled-auth = { workspace = true }
tiled-access = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
rand = "0.8"

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
