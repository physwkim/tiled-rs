[package]
name = "tiled-auth"
version.workspace = true
edition.workspace = true

[features]
default = ["oidc"]
oidc = ["dep:reqwest", "dep:sha2"]
saml = ["dep:samael"]
ldap = ["dep:ldap3", "dep:regex"]
pam = ["dep:libc"]

[dependencies]
tiled-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
argon2 = "0.5"
rand = "0.8"
async-trait = "0.1"
axum = { workspace = true }

# Feature-gated
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
samael = { version = "0.0.21", features = ["xmlsec"], optional = true }
# LDAP authenticator. rustls TLS keeps the dependency pure-Rust (no OpenSSL);
# the async (tokio) API is used. `regex` validates usernames against the
# configured pattern (LDAP-injection guard) and escapes CN commas.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls", "tls-rustls-ring"], optional = true }
regex = { workspace = true, optional = true }
# PAM is bound via a minimal portable FFI surface (pam_start/pam_authenticate/
# pam_end + a conversation callback) over the system `libpam`, so it builds on
# both Linux-PAM and macOS/BSD OpenPAM. `libc` supplies the C allocator that
# PAM frees the conversation response array with.
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_yaml = { workspace = true }
